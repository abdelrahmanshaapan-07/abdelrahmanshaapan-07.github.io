<style>
/* Layout: editorial monochrome. Giant serif+grotesk lockups, image overlapping the headline,
   a pinned sideways project gallery, then index, about, contact. Projects open as hash views. */
:root {
  --paper: #f1f1ef;
  --ink: #111111;
  --mute: #6d6d6b;
  --faint: #b9b9b6;
  --line: #d6d6d3;
  --card: #e4e4e1;
  --img-filter: grayscale(1) contrast(1.04);
  --serif: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 2.4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0d; --ink: #ececea; --mute: #8f8f8c; --faint: #4a4a48; --line: #262625; --card: #1a1a19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0d; --ink: #ececea; --mute: #8f8f8c; --faint: #4a4a48; --line: #262625; --card: #1a1a19;
  color-scheme: dark;
}
html[lang="ar"] {
  --serif: "Amiri", "Instrument Sans", serif;
  --sans: "IBM Plex Sans Arabic", "Instrument Sans", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: clip;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
img { display: block; max-width: 100%; }
video { display: block; width: 100%; height: auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.wrap { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.micro { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
html[lang="ar"] .micro { letter-spacing: 0; font-size: 12px; }
.serif { font-family: var(--serif); font-weight: 400; }
.heavy { font-family: var(--sans); font-weight: 800; font-stretch: 112%; }
html[lang="ar"] .heavy { font-weight: 700; }
.ph { filter: var(--img-filter); transition: filter .6s ease; background: var(--card); }
@media (hover: hover) { .ph:hover { filter: none; } }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-block: 14px; background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.lockup { text-decoration: none; line-height: .86; display: inline-block; }
.lockup .serif { display: block; font-size: 21px; letter-spacing: -.01em; }
.lockup .heavy { display: block; font-size: 21px; letter-spacing: -.02em; }
html[lang="ar"] .lockup .serif, html[lang="ar"] .lockup .heavy { font-size: 20px; line-height: 1.05; }
.mono {
  width: 34px; height: 34px; display: grid; place-items: center; text-decoration: none;
  font-family: var(--serif); font-size: 19px; font-style: italic; border: 1.5px solid var(--ink); border-radius: 50%;
}
.nav { justify-self: end; display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px;
  border: 1.5px solid var(--ink); border-radius: 10px; background: transparent; cursor: pointer;
  text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
html[lang="ar"] .pill { letter-spacing: 0; font-size: 13px; }
.pill.solid { background: var(--ink); color: var(--paper); }
.pill:hover { background: var(--ink); color: var(--paper); }
.nav .hide-sm { display: inline-flex; }
@media (max-width: 720px) { .nav .hide-sm { display: none; } .mono { display: none; } .top { grid-template-columns: 1fr auto; } }

/* ---------- hero ---------- */
.hero { position: relative; padding-top: 8px; }
.giant {
  margin: 0; line-height: .8; white-space: nowrap; font-size: clamp(64px, 15.2vw, 300px);
  letter-spacing: -.035em; display: flex; gap: .2em; position: relative; z-index: 1; width: max-content;
}
.giant .serif { letter-spacing: -.03em; }
.giant .heavy { letter-spacing: -.05em; }
html[lang="ar"] .giant { line-height: 1.1; font-size: clamp(64px, 15vw, 290px); letter-spacing: 0; gap: .12em; }
html[lang="ar"] .giant .serif, html[lang="ar"] .giant .heavy { letter-spacing: 0; }
.hero-grid {
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gutter);
  margin-top: clamp(30px, 4vw, 64px); position: relative;
}
.hero-meta { display: flex; justify-content: space-between; gap: 16px; font-family: var(--serif); font-size: clamp(17px, 1.35vw, 21px); }
.hero-left { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.lede { font-size: clamp(22px, 2.3vw, 34px); line-height: 1.12; letter-spacing: -.015em; font-weight: 500; margin: 0; max-width: 18em; text-wrap: balance; }
html[lang="ar"] .lede { line-height: 1.5; letter-spacing: 0; }
.lede em { font-style: normal; color: var(--faint); font-family: var(--serif); }
.hero-foot { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
.hero-foot p { margin: 0; max-width: 24em; font-size: clamp(14px, 1.1vw, 17px); line-height: 1.45; color: var(--mute); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.facts b { display: block; font-family: var(--sans); font-weight: 800; font-stretch: 112%; letter-spacing: -.03em; font-size: clamp(34px, 3.4vw, 54px); line-height: 1; font-variant-numeric: lining-nums; }
.facts span { display: block; margin-top: 8px; font-size: clamp(14px, 1.1vw, 17px); color: var(--mute); line-height: 1.35; }
.sig { font-family: var(--serif); font-style: italic; font-size: clamp(34px, 2.6vw, 44px); line-height: 1; opacity: .9; }
.hero-img { position: relative; margin: 0; }
.hero-img img { width: 100%; aspect-ratio: 16 / 10.5; object-fit: cover; }
.hero-img figcaption { margin-top: 8px; display: flex; justify-content: space-between; color: var(--mute); }
@media (max-width: 820px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-img { order: -1; }
}

/* ---------- marquee ---------- */
.marquee { margin-top: clamp(48px, 7vw, 100px); border-top: 1px solid var(--line); overflow: hidden; }
.mq-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); align-items: center; border-bottom: 1px solid var(--line); }
.mq-label { color: var(--mute); padding-inline-end: 0 !important; }
.mq-clip { overflow: hidden; padding-block: 22px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track { display: flex; align-items: center; width: max-content; animation: slide 40s linear infinite; }
.marquee-track.rev { animation-direction: reverse; animation-duration: 46s; }
html[dir="rtl"] .marquee-track { animation-name: slide-rtl; }
.logo { display: inline-flex; align-items: center; padding-inline: clamp(28px, 4vw, 60px); height: 72px; }
.logo img { width: auto; max-width: 220px; filter: grayscale(1) contrast(2.2); mix-blend-mode: multiply; }
.logo.inv img { filter: grayscale(1) invert(1) contrast(2.2); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo img { filter: grayscale(1) contrast(2.2) invert(1); mix-blend-mode: screen; }
  :root:not([data-theme="light"]) .logo.inv img { filter: grayscale(1) contrast(2.2); }
}
:root[data-theme="dark"] .logo img { filter: grayscale(1) contrast(2.2) invert(1); mix-blend-mode: screen; }
:root[data-theme="dark"] .logo.inv img { filter: grayscale(1) contrast(2.2); }
@media (max-width: 720px) { .mq-row { grid-template-columns: 1fr; } .mq-label { padding-top: 14px; } .mq-clip { padding-block: 10px 16px; } }
@keyframes slide { to { transform: translateX(-50%); } }
@keyframes slide-rtl { to { transform: translateX(50%); } }

/* ---------- section heads ---------- */
.sec-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gutter); align-items: end; padding-block: clamp(70px, 10vw, 150px) 34px; }
.sec-title { margin: 0; font-size: clamp(40px, 5.4vw, 86px); line-height: .88; letter-spacing: -.03em; }
.sec-title span { display: block; }
html[lang="ar"] .sec-title { line-height: 1.2; letter-spacing: 0; }
.sec-head p { margin: 0; max-width: 32em; color: var(--mute); justify-self: end; }
.glyph { width: 30px; height: 30px; border: 1.5px solid var(--ink); border-radius: 50%; margin-bottom: 18px; display: grid; place-items: center; font-family: var(--serif); font-style: italic; }
@media (max-width: 720px) { .sec-head { grid-template-columns: 1fr; } .sec-head p { justify-self: start; } }

/* ---------- pinned sideways gallery ---------- */
.rail-outer { position: relative; }
.rail-sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); height: calc(100vh - 64px - env(safe-area-inset-top, 0px)); overflow: hidden; display: flex; align-items: center; }
.rail { display: flex; gap: clamp(28px, 5vw, 90px); align-items: flex-start; will-change: transform; padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)); }
.slot { flex: none; width: clamp(260px, 27vw, 440px); text-decoration: none; display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.slot:nth-child(3n+2) { margin-top: 12vh; }
.slot:nth-child(3n) { margin-top: 4vh; width: clamp(240px, 22vw, 360px); }
.slot .meta { display: flex; justify-content: space-between; color: var(--mute); }
.slot img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.slot:nth-child(2n) img { aspect-ratio: 1 / 1; }
.slot h3 { margin: 4px 0 0; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 2.4vw, 38px); line-height: 1; letter-spacing: -.01em; }
.slot p { margin: 0; color: var(--mute); max-width: 30em; }
.slot:hover img { filter: none; }
.rail-count { position: absolute; bottom: 18px; inset-inline-start: max(var(--gutter), env(safe-area-inset-left, 0px)); color: var(--mute); }
@media (max-width: 820px), (prefers-reduced-motion: reduce) {
  .rail-outer { height: auto !important; }
  .rail-sticky { position: static; height: auto; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 20px; }
  .rail { transform: none !important; }
  .slot { scroll-snap-align: start; width: min(78vw, 360px) !important; margin-top: 0 !important; }
  .rail-count { display: none; }
}

/* ---------- index table ---------- */
.index { margin-top: clamp(60px, 8vw, 120px); border-top: 1.5px solid var(--ink); }
.row {
  display: grid; grid-template-columns: 56px minmax(0, 2.4fr) minmax(0, 1.6fr) minmax(0, 1fr) 70px 24px;
  gap: 16px; align-items: baseline; padding-block: 18px; border-bottom: 1px solid var(--line);
  text-decoration: none; cursor: pointer; transition: padding .3s ease;
}
.row:hover { padding-inline-start: 12px; }
.row .t { font-family: var(--serif); font-size: clamp(22px, 2.2vw, 34px); line-height: 1.05; }
.row .n, .row .y { font-variant-numeric: tabular-nums; color: var(--mute); }
.row .k, .row .f { color: var(--mute); }
.row .arr { font-family: var(--serif); }
html[dir="rtl"] .row .arr { transform: scaleX(-1); }
@media (max-width: 720px) { .row { grid-template-columns: 34px minmax(0, 1fr) auto; } .row .f, .row .y, .row .arr { display: none; } }

/* ---------- key concepts: big cards led by their publish date ---------- */
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(40px, 5vw, 80px) var(--gutter); border-top: 1.5px solid var(--ink); padding-top: 18px; }
.key { text-decoration: none; display: grid; gap: 14px; align-content: start; min-width: 0; }
.key:nth-child(2n) { margin-top: clamp(40px, 9vw, 140px); }
.key .top-line { display: flex; justify-content: space-between; color: var(--mute); }
.key img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.key:hover img { filter: none; }
.key .date { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.key .date b { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 3.4vw, 56px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: lining-nums; }
html[lang="ar"] .key .date b { letter-spacing: 0; }
.key .date .micro { color: var(--mute); }
.key h3 { margin: 0; font-family: var(--sans); font-weight: 800; font-stretch: 112%; font-size: clamp(22px, 2vw, 32px); line-height: 1; letter-spacing: -.02em; }
html[lang="ar"] .key h3 { font-weight: 700; letter-spacing: 0; line-height: 1.3; }
.key p { margin: 0; color: var(--mute); max-width: 30em; }
.more-head { margin-top: clamp(70px, 9vw, 130px); color: var(--mute); }
.index.more { margin-top: 12px; }
@media (max-width: 720px) { .keys { grid-template-columns: 1fr; } .key:nth-child(2n) { margin-top: 0; } }

/* ---------- archive ---------- */
.arch { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 28px 18px; }
.arch a { text-decoration: none; display: grid; gap: 8px; min-width: 0; }
.arch img { width: 100%; aspect-ratio: 4 / 3.1; object-fit: cover; }
.arch a:hover img { filter: none; }
.arch .cap { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.arch .cap span:first-child { font-family: var(--serif); font-size: 17px; line-height: 1.15; }
.arch .cap span:last-child { color: var(--mute); font-variant-numeric: tabular-nums; }

/* ---------- about ---------- */
.about { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gutter); }
.about .bio p { font-size: clamp(19px, 1.7vw, 25px); line-height: 1.35; margin: 0 0 1em; max-width: 30em; letter-spacing: -.01em; }
html[lang="ar"] .about .bio p { line-height: 1.75; letter-spacing: 0; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 22px; }
.lists ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.lists li { font-family: var(--serif); font-size: 19px; }
.lists .wide { grid-column: 1 / -1; }
.about-img img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
@media (max-width: 820px) { .about { grid-template-columns: 1fr; } .lists { grid-template-columns: 1fr; } }

/* ---------- contact ---------- */
.contact { padding-block: clamp(80px, 12vw, 180px) 40px; }
.contact .giant { font-size: clamp(56px, 13vw, 250px); }
.contact-row { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; margin-top: 34px; }
.email { font-family: var(--serif); font-size: clamp(24px, 3vw, 44px); word-break: break-all; }
.foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-block: 18px 28px; color: var(--mute); margin-top: 70px; }

/* ---------- project view ---------- */
#project { padding-bottom: 60px; }
.p-back { display: inline-flex; margin-block: 18px 6px; }
.p-title { margin: 0; font-size: clamp(54px, 11vw, 210px); line-height: .84; letter-spacing: -.04em; display: flex; flex-wrap: wrap; gap: 0 .12em; }
.p-title .serif { letter-spacing: -.03em; }
html[lang="ar"] .p-title { line-height: 1.15; letter-spacing: 0; }
html[lang="ar"] .p-title .serif { letter-spacing: 0; }
.p-line { font-size: clamp(20px, 2vw, 30px); line-height: 1.2; max-width: 26em; margin: 22px 0 0; letter-spacing: -.01em; font-weight: 500; }
html[lang="ar"] .p-line { line-height: 1.6; letter-spacing: 0; }
.p-hero { margin-top: 34px; }
.p-hero img { width: 100%; max-height: 86vh; object-fit: cover; }
.spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1.5px solid var(--ink); margin-top: 26px; }
.spec div { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
html[dir="rtl"] .spec div { padding: 14px 0 14px 16px; }
.spec dt { color: var(--mute); }
.spec dd { margin: 6px 0 0; font-family: var(--serif); font-size: 20px; font-variant-numeric: tabular-nums; }
.p-body { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: var(--gutter); margin-top: clamp(50px, 7vw, 100px); }
.p-body .side { display: grid; gap: 18px; align-content: start; }
.p-body .side div { display: grid; gap: 4px; }
.p-body .side span:last-child { font-family: var(--serif); font-size: 18px; line-height: 1.3; }
.story p { margin: 0 0 1.1em; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.45; max-width: 34em; }
.story p:first-child { font-size: clamp(22px, 2vw, 30px); line-height: 1.25; letter-spacing: -.01em; }
html[lang="ar"] .story p, html[lang="ar"] .story p:first-child { line-height: 1.8; letter-spacing: 0; }
.p-gal { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: clamp(14px, 2vw, 30px); margin-top: clamp(50px, 7vw, 100px); align-items: start; }
.p-gal figure { margin: 0; display: grid; gap: 8px; }
.p-gal figure:nth-child(4n+1) { grid-column: 1 / -1; }
.p-gal figure:nth-child(4n+2) { grid-column: 1 / span 7; }
.p-gal figure:nth-child(4n+3) { grid-column: 9 / span 4; margin-top: 18vh; }
.p-gal figure:nth-child(4n) { grid-column: 3 / span 8; }
.p-gal img { width: 100%; height: auto; }
.p-gal figcaption { color: var(--mute); display: flex; gap: 10px; }
.p-gal figcaption b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.p-note { margin-top: 30px; color: var(--mute); font-size: 13px; }
.p-next { display: block; text-decoration: none; margin-top: clamp(80px, 10vw, 150px); border-top: 1.5px solid var(--ink); padding-top: 18px; }
.p-next .serif { font-size: clamp(44px, 8vw, 140px); line-height: .95; display: block; margin-top: 8px; }
.p-next:hover .serif { font-style: italic; }
@media (max-width: 820px) {
  .p-body { grid-template-columns: 1fr; }
  .p-gal figure { grid-column: 1 / -1 !important; margin-top: 0 !important; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .marquee-track { animation: none; }
  .ph { transition: none; }
}
</style>

<header class="top wrap">

  <nav class="nav">

</header>

<main id="home">
  <section class="hero wrap" id="top">

      <div class="hero-left">
        <div class="hero-meta"><span data-t="person.name"></span><span data-t="person.base"></span></div>

      </div>
      <figure class="hero-img" style="margin-inline:0">
        <a href="#gamila" data-go="gamila"><img class="ph" src="img/gamila-01.jpg" alt="Ramses Gamila electric city car" fetchpriority="high"></a>

      </figure>
    </div>
  </section>

  <div class="marquee">
    <div class="mq-row"><span class="mq-label micro wrap" data-t="ui.workedWith"></span><div class="mq-clip" aria-hidden="true"><div class="marquee-track" id="mqClients"></div></div></div>
    <div class="mq-row"><span class="mq-label micro wrap" data-t="ui.featuredOn"></span><div class="mq-clip" aria-hidden="true"><div class="marquee-track rev" id="mqFeatured"></div></div></div>
  </div>

  <section id="work">
    <div class="sec-head wrap">
      <div><div class="glyph">w</div><h2 class="sec-title" id="workTitle"></h2></div>

      <div class="rail-sticky"><div class="rail" id="rail"></div><div class="rail-count micro" id="railCount"></div></div>

  </section>

  <section id="concepts" class="wrap">
    <div class="sec-head" style="padding-left:0;padding-right:0">
      <div><div class="glyph">c</div><h2 class="sec-title" id="conTitle"></h2></div>
      <p id="conNote"></p>
    </div>
    <div class="keys" id="keys"></div>
    <div class="micro more-head" data-t="ui.moreConcepts"></div>
    <div class="index more" id="moreConcepts"></div>
  </section>

  <section id="archive" class="wrap">
    <div class="sec-head" style="padding-left:0;padding-right:0">
      <div><div class="glyph">r</div><h2 class="sec-title" id="archTitle"></h2></div>
      <p id="archNote"></p>
    </div>
    <div class="arch" id="arch"></div>
    <div style="margin-top:28px"><a class="pill" id="archMore" target="_blank" rel="noopener"></a></div>
  </section>

  <section id="about" class="wrap">
    <div class="sec-head" style="padding-left:0;padding-right:0">
      <div><div class="glyph">a</div><h2 class="sec-title" id="aboutTitle"></h2></div>
    </div>
    <div class="about">
      <div class="about-img"><img class="ph" src="img/portrait.jpg" alt="Portrait of Abdelrahman Shaapan" loading="lazy"></div>
      <div>
        <div class="bio" id="bio"></div>
        <div class="lists">
          <div class="wide"><div class="micro" data-t="ui.experience"></div><ul id="experience"></ul></div>
          <div><div class="micro" data-t="ui.services"></div><ul id="services"></ul></div>
          <div><div class="micro" data-t="ui.tools"></div><ul id="tools"></ul></div>
        </div>
      </div>
    </div>
  </section>

  <section id="contact" class="contact wrap">
    <div class="micro" data-t="ui.contact"></div>
    <h2 class="giant" id="talk" style="margin-top:14px"></h2>
    <div class="contact-row" id="contactRow"></div>
    <footer class="foot micro"><span id="footName"></span><span id="footYear"></span></footer>
  </section>
</main>

<main id="project" class="wrap" hidden></main>

<script src="data.js"></script>
<script>
(() => {
  const D = window.PORTFOLIO;
  const P = D.PROJECTS;
  let lang = "en";
  try { const s = localStorage.getItem("as-lang"); if (s === "ar" || s === "en") lang = s; } catch (e) {}

  const t = (o) => (o == null ? "" : typeof o === "string" ? o : (o[lang] ?? o.en ?? ""));
  const get = (path) => path.split(".").reduce((a, k) => a && a[k], { ...D, ui: D.ui, person: D.person });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const $ = (id) => document.getElementById(id);

  // Split a name into a serif half and a heavy half, the way the lockups read.
  const halves = (str) => {
    const w = str.trim().split(/\s+/);
    if (w.length === 1) return [w[0], ""];
    const mid = Math.ceil(w.length / 2) - (w.length > 2 ? 0 : 0);
    return [w.slice(0, mid).join(" "), w.slice(mid).join(" ")];
  };
  const lock = (str, tag = "span") => {
    const [a, b] = halves(str);
    return `<${tag} class="serif">${esc(a)}</${tag}>${b ? `<${tag} class="heavy">${esc(b)}</${tag}>` : ""}`;
  };

  const copy = {
    giant: { en: ["Product", "Design"], ar: ["تصميم", "منتجات"] },
    lede: {
      en: "From the first sketch to the <em>finished object</em>, I design products people can picture in their hands.",
      ar: "من أول اسكتش لحد <em>القطعة الجاهزة</em>، بصمم منتجات تقدر تتخيلها في إيدك."
    },
    heroNote: {
      en: "Cars, furniture, appliances and consumer electronics, presented with my own renders and product films.",
      ar: "عربيات وأثاث وأجهزة وإلكترونيات، معروضة بالريندر وأفلام المنتجات اللي بعملها بنفسي."
    },
    heroCap: { en: "Ramses Gamila", ar: "رمسيس جميلة" },
    workTitle: { en: ["Selected", "Work"], ar: ["أعمال", "مختارة"] },
    workNote: {
      en: "Built pieces, competition entries, exhibition work and personal concepts. Open any project for the full story.",
      ar: "قطع اتنفذت، ومشاركات في مسابقات، وشغل معارض، وكونسبتات شخصية. افتح أي مشروع للحكاية كاملة."
    },
    aboutTitle: { en: ["About", "Me"], ar: ["عن", "نفسي"] },
    talk: { en: ["Let's", "Talk"], ar: ["يلا", "نتكلم"] },
    marquee: ["Cairo Design Week", "PHOTONX", "AlUla", "Blender", "KeyShot", "FATCO Riyadh", "Product Films", "Ramses"]
  };

  // Scale a one-line lockup so it fills its box exactly and never runs off screen.
  function fit(el) {
    el.style.fontSize = "100px";
    const box = el.parentElement.clientWidth - parseFloat(getComputedStyle(el.parentElement).paddingLeft) - parseFloat(getComputedStyle(el.parentElement).paddingRight);
    const size = Math.floor(100 * box / el.scrollWidth * 0.995);
    el.style.fontSize = Math.min(size, el.id === "talk" ? 250 : 300) + "px";
  }
  const fitAll = () => ["giant", "talk"].forEach((id) => fit($(id)));

  function applyStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    const [first, last] = halves(t(D.person.name));
    document.querySelectorAll("[data-t]").forEach((el) => {
      const k = el.dataset.t;
      if (k === "first") el.textContent = first;
      else if (k === "last") el.textContent = last;
      else el.textContent = t(get(k));
    });
    $("lang").textContent = lang === "en" ? "عربي" : "EN";
    const g = copy.giant[lang];
    $("giant").innerHTML = `<span class="serif">${g[0]}</span><span class="heavy">${g[1]}</span>`;
    $("lede").innerHTML = copy.lede[lang];
    $("heroNote").textContent = copy.heroNote[lang];
    $("facts").innerHTML = D.ui.facts.map((x) => `<div><b>${x.n}</b><span>${esc(x[lang])}</span></div>`).join("");
    $("heroCap").textContent = copy.heroCap[lang];
    const wt = copy.workTitle[lang];
    $("workTitle").innerHTML = `<span class="heavy">${wt[0]}</span><span class="serif">${wt[1]}</span>`;
    $("workNote").textContent = copy.workNote[lang];
    const at = copy.aboutTitle[lang];
    $("aboutTitle").innerHTML = `<span class="heavy">${at[0]}</span><span class="serif">${at[1]}</span>`;
    const tk = copy.talk[lang];
    $("talk").innerHTML = `<span class="serif">${tk[0]}</span><span class="heavy">${tk[1]}</span>`;
    fitAll();
    document.fonts?.ready.then(fitAll);

    // Repeat the logo set until one copy is wider than the screen, then double it for a seamless loop.
    const strip = (list) => {
      const one = list.map((b) => `<span class="logo${b.inv ? " inv" : ""}"><img src="img/brands/${b.f}" alt="${esc(b.n)}" style="height:${b.h}px"></span>`).join("");
      const set = one.repeat(Math.max(1, Math.ceil(10 / list.length)));
      return set + set;
    };
    $("mqClients").innerHTML = strip(D.BRANDS.clients);
    $("mqFeatured").innerHTML = strip(D.BRANDS.featured);

    // Work = everything made for or with someone; concepts get their own section below.
    const work = P.filter((p) => p.kind !== "concept");
    const keys = P.filter((p) => p.key);
    const others = P.filter((p) => p.kind === "concept" && !p.key);
    $("rail").innerHTML = work.map((p, i) => `
      <a class="slot" href="#${p.id}" data-go="${p.id}">
        <div class="meta micro"><span>${pad(i + 1)} · ${esc(t(D.kinds[p.kind]))}</span><span>${esc(p.year || t(p.field))}</span></div>
        <img class="ph" src="img/${p.images[0].f}.jpg" alt="${esc(t(p.title))}" loading="${i < 3 ? "eager" : "lazy"}">
        <h3>${esc(t(p.title))}</h3>
        <p>${esc(t(p.line))}</p>
      </a>`).join("");
    $("railCount").textContent = `${pad(work.length)} ${t(D.ui.projects)}`;

    const rows = (list) => list.map((p, i) => `
      <a class="row" href="#${p.id}" data-go="${p.id}">
        <span class="n micro">${pad(i + 1)}</span>
        <span class="t">${esc(t(p.title))}</span>
        <span class="f micro">${esc(t(p.field))}</span>
        <span class="k micro">${esc(t(D.kinds[p.kind]))}</span>
        <span class="y micro">${esc(p.year || "—")}</span>
        <span class="arr">→</span>
      </a>`).join("");
    $("index").innerHTML = rows(work);

    const ct = D.ui.concepts[lang];
    $("conTitle").innerHTML = `<span class="heavy">${esc(ct[0])}</span><span class="serif">${esc(ct[1])}</span>`;
    $("conNote").textContent = t(D.ui.conceptsNote);
    $("keys").innerHTML = keys.map((p, i) => {
      const pub = p.specs.find((s) => s.url);
      const date = pub ? t(pub.v).split(" · ")[0] : p.year;
      return `
      <a class="key" href="#${p.id}" data-go="${p.id}">
        <div class="top-line micro"><span>${pad(i + 1)} / ${pad(keys.length)}</span><span>${esc(t(p.field))}</span></div>
        <img class="ph" src="img/${p.images[0].f}.jpg" alt="${esc(t(p.title))}" loading="lazy">
        <div class="date"><span class="micro">${esc(t(D.ui.published))}</span><b>${esc(date)}</b></div>
        <h3>${esc(t(p.title))}</h3>
        <p>${esc(t(p.line))}</p>
      </a>`;
    }).join("");
    $("moreConcepts").innerHTML = rows(others);

    $("archTitle").innerHTML = `<span class="serif">${esc(t(D.ui.archive))}</span>`;
    $("archNote").textContent = t(D.ui.archiveNote);
    $("arch").innerHTML = D.ARCHIVE.map((a, i) => `
      <a href="https://www.behance.net/gallery/${a.id}" target="_blank" rel="noopener">
        <img class="ph" src="img/archive/${a.id}.jpg" alt="${esc(a.t)}" loading="lazy">
        <span class="cap"><span>${esc(a.t)}</span><span class="micro">${pad(P.length + i + 1)}</span></span>
      </a>`).join("");
    const more = $("archMore");
    more.href = D.behance;
    more.textContent = `Behance ↗`;

    $("bio").innerHTML =t(D.person.bio).map((x) => `<p>${esc(x)}</p>`).join("");
    $("services").innerHTML = D.person.services.map((s) => `<li>${esc(t(s))}</li>`).join("");
    $("experience").innerHTML = D.person.experience.map((s) => `<li>${esc(t(s))}</li>`).join("");
    $("tools").innerHTML = D.person.tools.map((s) => `<li>${esc(s)}</li>`).join("");

    const email = D.person.email;
    $("contactRow").innerHTML =
      (email
        ? `<span class="email" id="emailText">${esc(email)}</span><button class="pill" id="copyBtn" type="button">${esc(t(D.ui.copy))}</button>`
        : `<span class="email" style="color:var(--faint)">${esc(t(D.ui.noEmail))}</span>`) +
      `<a class="pill solid" href="Abdelrahman-Shaapan-Portfolio-2027.pdf" target="_blank" rel="noopener">${esc(t(D.ui.pdf))} ↓</a>` +
      D.person.links.map((l) => `<a class="pill" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
    const cb = $("copyBtn");
    if (cb) cb.addEventListener("click", () => {
      const done = () => { cb.textContent = t(D.ui.copied); setTimeout(() => (cb.textContent = t(D.ui.copy)), 1600); };
      navigator.clipboard?.writeText(email).then(done, () => {
        const r = document.createRange(); r.selectNodeContents($("emailText"));
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      });
    });
    $("footName").textContent = `© ${t(D.person.name)}`;
    $("footYear").textContent = `${t(D.person.role)} · ${t(D.person.base)}`;
    sizeRail();
  }

  function renderProject(id) {
    const i = P.findIndex((p) => p.id === id);
    const p = P[i];
    const nx = P[(i + 1) % P.length];
    const v = (x) => (typeof x === "string" ? x : t(x));
    const side = [
      [D.ui.role, t(p.role)],
      p.team ? [D.ui.team, t(p.team)] : null,
      [D.ui.field, t(p.field)],
      [D.ui.status, t(D.kinds[p.kind]) + (p.year ? ` · ${p.year}` : "")]
    ].filter(Boolean);
    $("project").innerHTML = `
      <a class="pill p-back" href="#work" data-go="work">${lang === "ar" ? "→" : "←"} ${esc(t(D.ui.back))}</a>
      <div class="micro" style="color:var(--mute);margin:26px 0 12px">${pad(i + 1)} / ${pad(P.length)} · ${esc(t(D.kinds[p.kind]))}</div>
      <h1 class="p-title">${lock(t(p.title))}</h1>
      <p class="p-line">${esc(t(p.line))}</p>
      <dl class="spec">${p.specs.map((s) => `<div><dt class="micro">${esc(t(s.k))}</dt><dd>${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(v(s.v))} ↗</a>` : esc(v(s.v))}</dd></div>`).join("")}</dl>
      <figure class="p-hero" style="margin-inline:0"><img class="ph" src="img/${p.images[0].f}.jpg" alt="${esc(t(p.images[0].c))}"></figure>
      <div class="p-body">
        <div class="side">${side.map(([k, val]) => `<div><span class="micro" style="color:var(--mute)">${esc(t(k))}</span><span>${esc(val)}</span></div>`).join("")}</div>
        <div class="story">${t(p.story).map((s) => `<p>${esc(s)}</p>`).join("")}</div>
      </div>
      <div class="p-gal">${p.images.slice(1).map((im, k) => `
        <figure>${im.v
          ? `<video class="ph" src="img/${im.v}.mp4" poster="img/${im.f}.jpg" muted loop playsinline preload="metadata" ${matchMedia("(prefers-reduced-motion: reduce)").matches ? "controls" : "autoplay"} aria-label="${esc(t(im.c))}"></video>`
          : `<img class="ph" src="img/${im.f}.jpg" alt="${esc(t(im.c))}" loading="lazy">`}
        <figcaption class="micro"><b>${pad(k + 2)}</b><span>${esc(t(im.c))}</span></figcaption></figure>`).join("")}
      </div>
      ${p.note ? `<p class="p-note">${esc(t(p.note))}</p>` : ""}
      <a class="p-next" href="#${nx.id}" data-go="${nx.id}">
        <span class="micro">${esc(t(D.ui.next))}</span>
        <span class="serif">${esc(t(nx.title))}</span>
      </a>`;
  }

  // Route by hash: a project id opens its page; anything else is the home page.
  function route(scrollTo) {
    const h = location.hash.replace("#", "");
    const isProject = P.some((p) => p.id === h);
    $("home").hidden = isProject;
    $("project").hidden = !isProject;
    if (isProject) { renderProject(h); window.scrollTo(0, 0); }
    else {
      sizeRail();
      const target = scrollTo || h;
      const el = target && target !== "top" && target !== "home" ? $(target) : null;
      if (el) el.scrollIntoView(); else if (scrollTo) window.scrollTo(0, 0);
    }
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-go]");
    if (!a) return;
    e.preventDefault();
    const go = a.dataset.go;
    if (P.some((p) => p.id === go)) { history.pushState(null, "", "#" + go); route(); }
    else { history.pushState(null, "", go === "home" ? "#top" : "#" + go); route(go); }
  });
  window.addEventListener("popstate", () => route());
  window.addEventListener("hashchange", () => route());

  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "ar" : "en";
    try { localStorage.setItem("as-lang", lang); } catch (e) {}
    applyStatic();
    if (!$("project").hidden) renderProject(location.hash.slice(1));
  });

  // Pinned sideways gallery: the outer box gets the rail's width as height,
  // and vertical scroll inside it moves the rail sideways.
  const outer = $("railOuter"), rail = $("rail");
  const flat = () => matchMedia("(max-width: 820px), (prefers-reduced-motion: reduce)").matches;
  let dist = 0;
  function sizeRail() {
    if (flat() || $("home").hidden) { outer.style.height = ""; rail.style.transform = ""; return; }
    dist = Math.max(0, rail.scrollWidth - window.innerWidth);
    outer.style.height = `${window.innerHeight + dist}px`;
    moveRail();
  }
  function moveRail() {
    if (flat() || !dist) return;
    const r = outer.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (outer.offsetHeight - window.innerHeight)));
    const x = p * dist * (lang === "ar" ? 1 : -1);
    rail.style.transform = `translate3d(${x}px,0,0)`;
  }
  window.addEventListener("scroll", () => requestAnimationFrame(moveRail), { passive: true });
  window.addEventListener("resize", () => { fitAll(); sizeRail(); });
  window.addEventListener("load", sizeRail);

  applyStatic();
  route();
})();
</script>
